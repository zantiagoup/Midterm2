<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThroneFind</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <!-- navbar logo + search ON STICKY -->
  <nav class="navbar sticky-top bg-body py-3">
    <div class="container">
      <a class="navbar-brand fs-3 fw-semibold" href="#" id="brand-reset">ThroneFind</a>
      <form class="d-flex" id="search-form" role="search">
        <div class="input-group">
          <input class="form-control search-input" type="search" id="search-input" placeholder="Name or number"
            aria-label="Search">
          <button class="btn btn-brand" type="submit">Search</button>
          <button class="btn btn-soft d-none" type="button" id="clear-search-btn">Reset</button>
        </div>
      </form>
    </div>
  </nav>

  <main class="container py-4">
    <!-- loading spinner -->
    <div id="loading-spinner" class="text-center my-5 d-none">
      <div class="spinner-border text-body-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-body-secondary">Opening the archive...</p>
    </div>

    <!-- error box, shows when api fails -->
    <div id="error-view" class="bg-body-secondary rounded p-4 text-center my-4 d-none" role="alert">
      <h4 class="fw-semibold">Nothing found</h4>
      <p id="error-message">The requested entry does not exist in the archive.</p>
      <button class="btn btn-soft" id="error-reset-btn">Back to all characters</button>
    </div>

    <!-- catalog grid, cards come from app.js -->
    <section id="catalog-section">
      <div class="d-flex justify-content-between align-items-baseline mb-3">
        <h1 class="h2 fw-semibold mb-0" id="catalog-subtitle">Characters</h1>
        <span class="text-body-secondary" id="catalog-count">0 entries</span>
      </div>
      <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="catalog-grid"></div>
    </section>
  </main>

  <!-- detail modal (dynamic) filled by app.js -->
  <div class="modal fade" id="characters-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-name">Character Name</h5>
          <span class="ms-2 text-body-secondary" id="modal-id">#000</span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <!-- modal body CONTANER -------------------------->
        <div class="modal-body">
          <div class="row">

            <!-- main img left container -->
            <div class="col-md-6">
              <img id="modal-img" class="w-100 rounded" src="" alt="Character">
            </div>

            <!-- char info right  container-->
            <div class="col-md-6">
              <p><strong>First name:</strong> <span id="modal-first"></span></p>
              <p><strong>Last name:</strong> <span id="modal-last"></span></p>
              <p><strong>Born:</strong> <span id="modal-born"></span></p>
              <p><strong>Died:</strong> <span id="modal-died"></span></p>
              <p><strong>Titles:</strong> <span id="modal-titles"></span></p>
              <p><strong>Aliases:</strong> <span id="modal-aliases"></span></p>
              <p><strong>Family:</strong> <span id="modal-family"></span></p>
              <img id="modal-crest" class="rounded" width="64" height="64" src="" alt="Family crest">
            </div>
          </div>
        </div>

        <!-- prev / next char  navs-->
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-soft fs-4" id="prev-btn">&lsaquo;</button>
          <button type="button" class="btn btn-soft fs-4" id="next-btn">&rsaquo;</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>

</html>
